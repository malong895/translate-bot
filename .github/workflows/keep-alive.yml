name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          if [ -n "${{ secrets.RENDER_URL }}" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.RENDER_URL }}/healthz" || true
          else
            echo "RENDER_URL secret not set; skipping"
          fi
